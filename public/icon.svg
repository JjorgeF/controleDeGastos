<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Subtle glow aura behind emblem -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Main Financial Shield / Wallet Emblem -->
  <g transform="translate(106, 116)">
    <!-- Back card / wallet layer -->
    <rect x="20" y="20" width="260" height="170" rx="32" fill="url(#accentGrad)" opacity="0.35" transform="rotate(-6 150 105)" />
    
    <!-- Front card -->
    <rect x="25" y="45" width="250" height="165" rx="28" fill="#181c28" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    
    <!-- Chip element -->
    <rect x="55" y="75" width="44" height="34" rx="8" fill="url(#goldGrad)" opacity="0.9" />
    <line x1="55" y1="92" x2="99" y2="92" stroke="#92400e" stroke-width="2" />
    <line x1="77" y1="75" x2="77" y2="109" stroke="#92400e" stroke-width="2" />

    <!-- Growth trend line / chart upward curve -->
    <path d="M 125 155 Q 165 140 190 100 T 245 80" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="245,80 230,85 242,98" fill="#34d399" />

    <!-- Currency Emblem: Coin / Badge in front right -->
    <g transform="translate(190, 130)">
      <circle cx="45" cy="45" r="42" fill="#0d111a" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#glow)" />
      <text x="45" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#34d399" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
