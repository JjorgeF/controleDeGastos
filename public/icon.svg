<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Luxury Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="45%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- High-Contrast Fintech Emerald/Cyan Gradient -->
    <linearGradient id="fcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow for Drop Shadow -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="44" result="blur" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Light Orbs -->
  <circle cx="140" cy="150" r="140" fill="#38bdf8" opacity="0.12" filter="url(#ambientBlur)" />
  <circle cx="370" cy="360" r="150" fill="#10b981" opacity="0.18" filter="url(#ambientBlur)" />

  <!-- Main FC Monogram (Centered horizontally 110 to 404, vertically 136 to 376) -->
  <g>
    <g filter="url(#shadowGlow)">
      <!-- Letter F -->
      <path d="M 110 136
               H 232
               C 242 136 248 142 248 152
               V 178
               C 248 188 242 194 232 194
               H 162
               V 234
               H 220
               C 230 234 236 240 236 250
               V 274
               C 236 284 230 290 220 290
               H 162
               V 360
               C 162 370 156 376 146 376
               H 126
               C 116 376 110 370 110 360
               V 152
               C 110 142 116 136 126 136
               Z"
            fill="url(#fcGrad)" />

      <!-- Top highlight on F -->
      <path d="M 110 136
               H 232
               C 242 136 248 142 248 152
               V 158
               C 240 146 226 146 216 146
               H 126
               C 118 146 110 150 110 158
               V 152
               C 110 142 116 136 126 136
               Z"
            fill="url(#specularGrad)" />

      <!-- Letter C -->
      <path d="M 388 136
               C 398 136 404 142 404 152
               V 178
               C 404 188 398 194 388 194
               H 344
               C 324 194 312 206 312 224
               V 288
               C 312 306 324 318 344 318
               H 388
               C 398 318 404 324 404 334
               V 360
               C 404 370 398 376 388 376
               H 344
               C 296 376 262 342 262 288
               V 224
               C 262 170 296 136 344 136
               H 388
               Z"
            fill="url(#fcGrad)" />

      <!-- Top highlight on C -->
      <path d="M 388 136
               C 398 136 404 142 404 152
               V 158
               C 396 146 382 146 372 146
               H 344
               C 306 146 278 166 268 200
               C 272 160 304 136 344 136
               H 388
               Z"
            fill="url(#specularGrad)" />

      <!-- Financial Growth / Live Spark in the C pocket -->
      <circle cx="360" cy="256" r="15" fill="#38bdf8" />
      <circle cx="360" cy="256" r="7" fill="#ffffff" opacity="0.9" />
    </g>
  </g>
</svg>
